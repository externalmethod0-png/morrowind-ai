# Morrowind AI — Isolated Configuration
# Read API keys from ~/.nemoclaw_env — never hardcode secrets here

# ---------------------------------------------------------------------------
# Provider / model selection per agent
# ---------------------------------------------------------------------------
# Each agent reads its own block and calls providers.factory.get_provider().
# To switch any agent's backend: change provider + model, then restart mw-bridge.
#
# Supported providers:
#   gemini    — Google Gemini (GOOGLE_API_KEY in ~/.nemoclaw_env)
#   openai    — OpenAI        (OPENAI_API_KEY in ~/.nemoclaw_env)
#   anthropic — Claude        (ANTHROPIC_API_KEY in ~/.nemoclaw_env)
#   ollama    — Local Ollama  (no auth, add base_url to override default)
#   llamacpp  — llama.cpp     (no auth, add base_url to override default)
#
# NOTE: pixel_agent requires a vision-capable model.
#       llamacpp does NOT support vision — it will warn and drop the image.
# ---------------------------------------------------------------------------
models:
  # ── ДВЕ ИНСТРУКЦИИ НА ВЫБОР ───────────────────────────────────────────────
  # prompt_profile решает, насколько подробно объяснять модели её работу.
  # Инструкция уходит в модель ПРИ КАЖДОЙ реплике, поэтому её длина — это и
  # счёт за API, и время ожидания перед ответом.
  #
  #   full — 22 000 знаков. Все двадцать действий с разобранными примерами,
  #          правила мира, тонкости характера. Нужна облачным моделям, которые
  #          и так велики: они вытягивают из подробностей больше живости.
  #
  #   lite — 6 444 знака, на 71% короче. Те же двадцать действий и все теги,
  #          но описания сжаты до сути. Сделана для домашних моделей: мелкая
  #          модель в длинной инструкции ТЕРЯЕТСЯ, а не выигрывает.
  #
  # По умолчанию профиль угадывается: local/ollama/llamacpp → lite, облако →
  # full. Строка prompt_profile перебивает догадку — ставь её, если хочешь
  # платить меньше на облаке (lite) или выжать максимум из домашней модели,
  # которой хватает памяти (full).

  # Разговоры с NPC — на СВОЕЙ модели через llama.cpp. Сервер поднимается
  # ярлыком llamacpp\ЗАПУСК СЕРВЕРА.bat; если он не поднят, запросы молча
  # уходят в облако по блоку fallback и персонажи не замолкают.
  lore_agent:
    provider: gemini
    model: gemini-flash-lite-latest
    prompt_profile: full     # full | lite — см. раздел про две инструкции
    temperature: 0.8

  # Сценки между NPC — по этому же блоку работает scene_agent.
  # СВОЙ слот, и это главное: у сценочной записки с разговорной НЕТ общего
  # начала, поэтому на одном слоте каждая сценка стирала разбор правил мира.
  d2d_agent:
    provider: gemini
    model: gemini-flash-lite-latest
    temperature: 0.9

  # ── СВОЯ МОДЕЛЬ ВМЕСТО ОБЛАКА ─────────────────────────────────────────────
  # Замени два блока выше на такие — и разговоры со сценками пойдут через
  # LM Studio: без ключа, без квот, бесплатно. В LM Studio нужно нажать
  # «Start Server» (вкладка Developer) и загрузить модель — КАК ИМЕННО
  # загружать, см. ниже, это важнее, чем кажется.
  #
  # lore_agent:
  #   provider: local
  #   base_url: http://localhost:1234/v1   # LM Studio; Ollama — :11434/v1
  #   model: gigachat3.1-10b-a1.8b         # пусто = какая загружена в сервере
  #   prompt_profile: lite
  #   temperature: 0.5
  #   timeout: 90
  #   fallback:                            # сервер не поднят — уйдём в облако
  #     provider: gemini
  #     model: gemini-flash-lite-latest
  #
  # d2d_agent:
  #   provider: local
  #   base_url: http://localhost:1234/v1
  #   model: gigachat3.1-10b-a1.8b
  #   temperature: 0.9
  #   timeout: 120
  #   fallback:
  #     provider: gemini
  #     model: gemini-flash-lite-latest

  # ВНИМАНИЕ: этому агенту нужно зрение, а домашние модели его не умеют —
  # оставляем в облаке. Локальный провайдер картинку молча выбросит.
  pixel_agent:
    provider: gemini
    model: gemini-flash-lite-latest
    temperature: 0.3

  obs_director:
    provider: gemini
    model: gemini-flash-lite-latest
    temperature: 0.2

  # ── ЭТАЛОННЫЕ НАСТРОЙКИ СЕРВЕРА (замерено, а не на глаз) ─────────────────
  # llamacpp\ЗАПУСК СЕРВЕРА.bat:
  #     -c 8192 -np 2 -fa on -ctk q8_0 -ctv q8_0 -ngl 999
  #
  # Замер: 40 реплик подряд, между каждой — сценка между NPC, и каждый раз
  # ДРУГОЙ персонаж. Мерить одного и того же подряд бессмысленно: там выходит
  # 0.8 с вместо честных трёх.
  #
  #     реплики  1-10   5.4 с   (кеши ещё наполняются)
  #     реплики 11-20   3.2 с
  #     реплики 21-30   2.9 с
  #     реплики 31-40   3.0 с   худшая 4.0 с
  #
  # Было на одном слоте — 13.4 с. Разница пятикратная.
  #
  # ЧТО ЗДЕСЬ ГЛАВНОЕ. Не флаги как таковые, а «-np 2» — ДВА СЛОТА. Слот это
  # ячейка, где сервер держит разбор промпта. Записок у мода две, разговорная
  # и сценочная, и общего начала у них НОЛЬ знаков. На одном слоте каждая
  # сценка стирала разбор правил мира, и следующая реплика игрока читала их
  # заново — вот откуда брались тринадцать секунд.
  #
  # Второе по важности — ЗАПАС ПАМЯТИ. Модель занимает 6.6 из 8.2 ГБ. Браузер
  # с видео идёт через ту же карту, и когда свободного мало, часть модели
  # вытесняется в системную память: время скачет втрое и обратно. Контекст по
  # 4096 на слот и сжатый KV-кеш оставляют полтора гигабайта запаса, и на
  # этом запасе цифры выше держатся ровно даже под ютубом.
  #
  # ЧТО ПРОВЕРЕНО И НЕ ПОМОГЛО (чтобы не пробовать заново):
  #   flash-attention сам по себе  13.4 -> 13.4 с. Ноль, до последней цифры.
  #   крупный батч -ub 2048        поверх двух слотов ВРЕДИТ: когда кеш цел,
  #                                разбирать нечего, батч только мешает.
  #   контекст 8192 на слот        то же время, но запаса памяти нет.
  #   чистка слотов на ходу        не лечит просадку; помогает только
  #                                перезапуск сервера.
  #   хвост промпта вперёд         1.7 с вместо 2.7, но точность 73 из 84
  #                                вместо 81. Отклонено, см. lore_agent.py.
  #
  # ГДЕ УПИРАЕТСЯ ТЕПЕРЬ. Генерация идёт 39 токенов/с и настройками сервера не
  # ускоряется — это свойство модели. Реплика в сто токенов стоит две с
  # половиной секунды. Дальше выигрывать можно только короткими репликами.
  #
  # ДРУГИЕ МОДЕЛИ на этих же настройках, те же 40 реплик:
  #   gigachat3.1-10b-a1.8b   3.0 с   генерация 39 т/с   (разреженная, 1.8B
  #                                                       активных из 10B)
  #   saineko-hydra-12b Q3    6.5 с   генерация 13 т/с   (плотная, работают
  #                                                       все 12B — вдвое
  #                                                       медленнее, в цель
  #                                                       не проходит)

  # ── КАК ЗАГРУЖАТЬ МОДЕЛЬ (важнее, чем кажется) ───────────────────────────
  # В LM Studio есть настройка "parallel" — сколько запросов модель ведёт
  # разом. Она НЕ бесплатна: контекст делится между слотами поровну. При
  # контексте 8192 и parallel 4 каждому запросу достаётся 2048 токенов, а
  # настоящий запрос мода весит ~3300 — он не помещается, и llama.cpp
  # разбирает инструкцию ЗАНОВО на каждую реплику. В игре это выглядело как
  # «PROCESSING PROMPT 0.00%» и двадцать секунд ожидания.
  #
  # Грузить так (или выставить то же в окне загрузки LM Studio):
  #     lms load gigachat3.1-10b-a1.8b --gpu max --context-length 8192 --parallel 1
  #
  # Один слот на весь контекст — запрос помещается целиком, начало промпта
  # переиспользуется, тёплый ответ приходит за ~3.5 секунды вместо двадцати.
  # Порядок блоков в промпте подобран под это же (см. lore_agent.py): всё
  # неизменное идёт первым, персонаж — последним.

  # ── ЗАМЕР ДОМАШНИХ МОДЕЛЕЙ ────────────────────────────────────────────────
  # tests/bench_all_models.py: каждая модель мерится ОДНА в видеопамяти —
  # две загруженные разом делят 8 ГБ, часть слоёв уезжает на процессор, и
  # цифры выходят втрое хуже настоящих. Раскладка слоёв фиксируется при
  # загрузке, так что выгрузить соседа задним числом уже не помогает.
  #
  #   модель                      диалоги  медиана  ток/с   сценки  медиана
  #   gigachat3.1-10b-a1.8b       25-27/28   4.9 с    745   36/36     6.1 с
  #   saineko-hydra Q3_K_S          27/28    8.7 с    347   28/36    37.8 с
  #   saineko-hydra Q2_K            26/28   12.0 с    278   32/36    39.4 с
  #   vikhr-nemo-dostoevsky Q3      27/28   11.1 с    291   36/36    21.4 с
  #
  # По диалогам модели НЕРАЗЛИЧИМЫ — разброс прогона ±3 балла. Разница в
  # сценках и в скорости: гигачат делает сценку за 6 секунд против сорока у
  # saineko, а та вдобавок дважды из трёх выдала на прямое указание пустую
  # сцену. Меньшая квантизация saineko не помогла: Q2 не быстрее Q3, потому
  # что обе и так помещались в память целиком.
  #
  # Скорость снята при свободной карте. Домашняя модель делит видеокарту с
  # озвучкой — с XTTS ставь tts.engine: morrowind или piper.
  # Разбор ответа защитный: неверный тег превращается в «none», мод не ломается.

# ---------------------------------------------------------------------------
# Legacy Gemini section — kept for backwards compatibility with old code.
# New agents use models: above instead.
# ---------------------------------------------------------------------------
gemini:
  model: gemini-flash-lite-latest
  lore_agent_temp: 0.8
  pixel_agent_temp: 0.3
  director_agent_temp: 0.2
  max_retries: 3

# Потолок длины ответа. Не средство укоротить реплику — для этого правила
# краткости в промпте; здесь именно потолок, и он должен быть С ЗАПАСОМ. Если
# обрезать по нему, ответ оборвётся на полуслове И ПОТЕРЯЕТ БЛОК ТЕГОВ, который
# идёт после реплики, — движок не выполнит ни одного действия.
max_output_tokens: 420

campaign_id: "morrowind-default"

# Radiant ambient dialogue settings (NPC-to-NPC D2D system).
radiant:
  enabled: true
  # Lua-side cooldown (PAIR_COOLDOWN in npc_detector.lua) controls how often the
  # same NPC pair can trigger; this is just the Python-side gate if needed.
  min_interval_s: 60

# Per-NPC disposition, mood residue, and life-facts layer.
# Stored in chroma_dir/dispositions.json. When off, the lore_agent prompt is
# unchanged from its pre-disposition shape — useful for isolating failures
# while radiant D2D / ACTION handling are still being field-tested.
features:
  disposition: true

ipc:
  dir: /home/nemoclaw/morrowind-ai/ipc
  events_dir: /home/nemoclaw/morrowind-ai/ipc/events
  poll_interval_ms: 100

memory:
  chroma_dir: /home/nemoclaw/morrowind-ai/chroma
  history_limit: 10

obs:
  host: localhost
  port: 4455
  password: ""  # set if OBS websocket has a password
  enabled: false  # set to true when OBS is running

stream:
  enabled: false  # set true to activate YouTube live chat -> game events
  youtube_video_id: ""  # set YouTube live video_id before enabling
  chat_poll_interval: 1.0

pixel:
  enabled: false
  capture_interval_sec: 3
  window_title: OpenMW
  resize_to: [1024, 768]

logs:
  dir: /home/nemoclaw/morrowind-ai/logs
  level: INFO

# Голоса NPC — стартуют вместе с мостом.
#
# Нагрузка разведена по трём устройствам:
#   игра          -> видеоядро AMD (в параметрах Windows: Графика -> openmw.exe
#                    -> «Конкретный GPU» -> Radeon; общий переключатель
#                    «Энергосбережение» на OpenGL НЕ действовал),
#   озвучка XTTS  -> ускоритель NVIDIA CMP 70HX, теперь он её единоличный,
#   распознавание -> процессор.
# Проверять раскладку: ПРОВЕРКА РАСКЛАДКИ.bat
#
# Замеры на этой машине, одна и та же реплика:
#   piper     0.6-0.9 с, процессор. Дикция ЧЁТЧЕ ВСЕХ, но голоса не из игры.
#   morrowind 0.1-0.2 с, процессор. Тембр родных актёров; дикция слабее —
#             материала для дообучения мало (1823 клипа, ~99 минут), и
#             увеличение шагов вчетверо разницы почти не дало.
#   xtts      клонирует голос с родной озвучки НА ХОДУ. Качество выше всех
#             остальных: распознаётся дословно. Держит ускоритель.
#             Замер по длине реплики (карта свободна, латенты прогреты):
#                56 знаков — 4.7 с      (столько и выдаёт игра: промпт
#                86 знаков — 4.1 с       держит ответ в 30 слов)
#               191 знак   — 11.2 с, двумя кусками: первый звучит с 5.0 с
#             Прежние «56 секунд» и «17.4 с» устарели вдвойне: первое мерили,
#             когда игра рендерилась на этой же карте, второе — на строке в
#             219 знаков, каких промпт больше не порождает.
#             На ПРОЦЕССОРЕ медленнее в 2-3 раза (8.6 / 12.5 / 22.4 с) и там
#             же дерётся за ядра с распознаванием — проверено, не вариант.
#             Паузу до первого звука закрывает ЗАРАНЕЕ нарисованная заминка
#             тем же голосом (data/fillers_xtts, tools/build_fillers.py).
#             ВАЖНО: xtts держит ускоритель, поэтому voice.compute_device
#             обязан быть cpu — иначе распознавание даёт разброс 6-71 с.
tts:
  enabled: true
  # Заминка перед ответом («Хм…», «Дай-ка подумать») — ВЫКЛЮЧЕНА решением
  # игрока. Она затыкала паузу, когда цепочка занимала восемь секунд; сейчас
  # от отпускания клавиши до звука проходит меньше трёх, и мычание стало
  # лишним — оно только оттягивает настоящий ответ.
  # Банк заготовок никуда не делся (data/fillers_xtts, 20 голосов × 8 фраз):
  # поставь filler: true — и вернётся, пересобирать нечего.
  filler: false
  # ВЫБРАНО ИГРОКОМ НА СЛУХ в очной ставке семи вариантов (ГОЛОСА-СРАВНЕНИЕ на
  # рабочем столе): дообученные голоса дают лучшую дикцию и самую живую
  # интонацию. Замер разборчивости этого НЕ показал — все варианты упёрлись в
  # 11-12 слов из 12, метрика мерит «можно ли разобрать», а не «приятно ли».
  engine: morrowind   # morrowind | piper | xtts | silero | edge
  # spatial — отдавать голос ДВИЖКУ игры: звук идёт из точки, где стоит NPC,
  # слышно направление, его глушат стены, он замолкает вместе с паузой. Иначе
  # реплику играем мимо игры и громкость подгоняем сами по расстоянию.
  # ВНИМАНИЕ: режим требует, чтобы файлы-слоты появились ДО запуска игры (их
  # делает мост при старте), и в самой игре ещё не проверен — включай, только
  # если готов проверить и откатить.
  spatial: false

# Голосовой режим (клавиша V): микрофон -> whisper (Wisper venv) -> диалог
voice:
  enabled: true
  device: fifine   # часть имени микрофона; пусто = устройство Windows по умолчанию
  # Где считать распознавание — зависит от того, кто отвечает за NPC.
  # Замеры на этой машине (одна и та же фраза, 5 прогонов):
  #   NVIDIA свободна        — 2.2 с, стабильно;
  #   NVIDIA занята (XTTS)   — от 6 до 71 секунды, разброс дикий;
  #   процессор              — 3.2 с, на загрузку карты не реагирует вовсе.
  # Отсюда две раскладки под этот ПК (переключаются в лаунчере):
  #   облачный Gemini -> cuda  (ускоритель свободен, отдаём его распознаванию)
  #   своя модель     -> cpu   (ускоритель целиком под неё)
  # Отрисовка игры в обоих случаях на видеоядре AMD, синтез речи — на
  # процессоре: дообученным голосам карта не нужна.
  compute_device: cpu

# Рассказчик (клавиша U): vision=true — делает кадр экрана и ОПИСЫВАЕТ РЕАЛЬНУЮ сцену
narrator:
  vision: true
